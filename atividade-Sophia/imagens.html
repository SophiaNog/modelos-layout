<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Imagens</title>
    <link rel="stylesheet" href="grids.css">
    <style>

        .row{
            margin-bottom: 10px;
        }

        .border{
            border: 1px solid rgb(32, 64, 133);
        }

        .coluna-imagem2{
            height: 100px;
        }

        .coluna-imagem3{
            padding: 20px;
        }

        .borda-imagem{
            border: 1px solid rgb(32, 64, 133);
            border-radius: 5px;
        }

    </style>
</head>
<body>
    
    <div class="container">

        <div class="row">
            <div class="col-12">
                <a href="index.html">Voltar</a>
                <h1>Imagens</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-12 border">
                <h1>Imagens</h1>
            </div>
        </div>

        <div class="row gap-1">
            <div class="col-4 border">
                <img src="imagens/minecraft.jpg" class="img-responsive" alt="">
            </div>
            <div class="col-8 border">Descrição da imagem</div>
        </div>

        <div class="row gap-1">
            <div class="col-4 coluna-imagem2 border">
                 <img src="imagens/minecraft.jpg" class="img-fill" alt="">
            </div>
            <div class="col-8">
                Imagem com a classe para ocupar 100% do espaço
            </div>
        </div>

          <div class="row gap-1">
            <div class="col-4 border coluna-imagem3">
                <img src="imagens/minecraft.jpg" class="img-responsive borda-imagem" alt="">
            </div>
            <div class="col-8 border">Descrição da imagem</div>
        </div>

    </div>

</body>
</html>
